<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | NIDIS'">NIDIS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- Navbar Fragment -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm py-2">
    <div class="container-fluid px-3 px-md-4">
        <!-- Role-Specific Brand Link -->
        <a sec:authorize="hasAuthority('SUPER_ADMIN')" class="navbar-brand fw-bold" th:href="@{/admin/dashboard}">
            <i class="bi bi-shield-lock-fill me-2"></i>NIDIS <span class="badge bg-danger ms-1 small" style="font-size: 0.65rem;">ADMIN</span>
        </a>
        <a sec:authorize="hasAuthority('VERIFICATION_OFFICER') and !hasAuthority('SUPER_ADMIN')" class="navbar-brand fw-bold" th:href="@{/verification/queue}">
            <i class="bi bi-shield-lock-fill me-2"></i>NIDIS <span class="badge bg-info text-dark ms-1 small" style="font-size: 0.65rem;">OFFICER</span>
        </a>
        <a sec:authorize="!hasAuthority('SUPER_ADMIN') and !hasAuthority('VERIFICATION_OFFICER')" class="navbar-brand fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-shield-lock-fill me-2"></i>NIDIS
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto" sec:authorize="isAuthenticated()">
                
                <!-- APPLICANT Links Only -->
                <li class="nav-item" sec:authorize="hasAuthority('APPLICANT') and !hasAuthority('SUPER_ADMIN') and !hasAuthority('VERIFICATION_OFFICER')">
                    <a class="nav-link" th:href="@{/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item dropdown" sec:authorize="hasAuthority('APPLICANT') and !hasAuthority('SUPER_ADMIN') and !hasAuthority('VERIFICATION_OFFICER')">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-file-earmark-plus me-1"></i>Apply
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/license}"><i class="bi bi-car-front me-2"></i>Driver's License</a></li>
                        <li><a class="dropdown-item" th:href="@{/passport}"><i class="bi bi-globe me-2"></i>Passport</a></li>
                        <li><a class="dropdown-item" th:href="@{/nic}"><i class="bi bi-person-badge me-2"></i>NIC</a></li>
                    </ul>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('APPLICANT') and !hasAuthority('SUPER_ADMIN') and !hasAuthority('VERIFICATION_OFFICER')">
                    <a class="nav-link" th:href="@{/payment/my-payments}">
                        <i class="bi bi-wallet2 me-1"></i>My Payments
                    </a>
                </li>

                <!-- VERIFICATION_OFFICER Links Only -->
                <li class="nav-item" sec:authorize="hasAuthority('VERIFICATION_OFFICER') and !hasAuthority('SUPER_ADMIN')">
                    <a class="nav-link" th:href="@{/verification/queue}">
                        <i class="bi bi-clipboard-check me-1"></i>Verification Queue
                    </a>
                </li>

                <!-- SUPER_ADMIN Links Only -->
                <li class="nav-item" sec:authorize="hasAuthority('SUPER_ADMIN')">
                    <a class="nav-link" th:href="@{/admin/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('SUPER_ADMIN')">
                    <a class="nav-link" th:href="@{/admin/users}">
                        <i class="bi bi-people me-1"></i>User Management
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('SUPER_ADMIN')">
                    <a class="nav-link" th:href="@{/verification/queue}">
                        <i class="bi bi-clipboard-check me-1"></i>Verification Queue
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('SUPER_ADMIN')">
                    <a class="nav-link" th:href="@{/admin/audit-log}">
                        <i class="bi bi-journal-text me-1"></i>Audit Log
                    </a>
                </li>

            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <span class="nav-link text-light">
                        <i class="bi bi-person-circle me-1"></i>
                        <span sec:authentication="name">User</span>
                    </span>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm ms-2">
                            <i class="bi bi-box-arrow-right me-1"></i>Logout
                        </button>
                    </form>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/login}">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Login
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

</body>
</html>
