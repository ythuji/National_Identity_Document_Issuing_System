<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | NIDIS'">NIDIS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Dashboard typography -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css(v='20260920-01')}" rel="stylesheet">
    <!-- Admin Design System & Layout CSS -->
    <link th:href="@{/css/admin.css(v='20260920-01')}" rel="stylesheet">
</head>
<body>

<!-- Navbar Fragment -->
<nav th:fragment="navbar" class="navbar navbar-dark nidis-navbar py-2">
    <div class="container-fluid px-3 px-md-4">
        <!-- Role-Specific Brand Link -->
        <a sec:authorize="hasAuthority('SUPER_ADMIN')" class="navbar-brand fw-bold" th:href="@{/admin/dashboard}">
            <img th:src="@{/images/nidis-mark.svg}" alt="NIDIS logo"><span>NIDIS</span> <span class="navbar-role navbar-role--admin">ADMIN</span>
        </a>
        <a sec:authorize="hasAuthority('VERIFICATION_OFFICER') and !hasAuthority('SUPER_ADMIN')" class="navbar-brand fw-bold" th:href="@{/verification/queue}">
            <img th:src="@{/images/nidis-mark.svg}" alt="NIDIS logo"><span>NIDIS</span> <span class="navbar-role navbar-role--officer">OFFICER</span>
        </a>
        <a sec:authorize="!hasAuthority('SUPER_ADMIN') and !hasAuthority('VERIFICATION_OFFICER')" class="navbar-brand fw-bold" th:href="@{/dashboard}">
            <img th:src="@{/images/nidis-mark.svg}" alt="NIDIS logo"><span>NIDIS</span>
        </a>

        <div class="navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto" sec:authorize="isAuthenticated()">
                
                <!-- APPLICANT Links Only -->
                <li class="nav-item" sec:authorize="hasAuthority('APPLICANT') and !hasAuthority('SUPER_ADMIN') and !hasAuthority('VERIFICATION_OFFICER')">
                    <a class="nav-link" th:href="@{/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('APPLICANT') and !hasAuthority('SUPER_ADMIN') and !hasAuthority('VERIFICATION_OFFICER')">
                    <a class="nav-link" th:href="@{/license}"><i class="bi bi-car-front me-1"></i>License</a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('APPLICANT') and !hasAuthority('SUPER_ADMIN') and !hasAuthority('VERIFICATION_OFFICER')">
                    <a class="nav-link" th:href="@{/passport}"><i class="bi bi-globe me-1"></i>Passport</a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('APPLICANT') and !hasAuthority('SUPER_ADMIN') and !hasAuthority('VERIFICATION_OFFICER')">
                    <a class="nav-link" th:href="@{/nic}"><i class="bi bi-person-badge me-1"></i>NIC</a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('APPLICANT') and !hasAuthority('SUPER_ADMIN') and !hasAuthority('VERIFICATION_OFFICER')">
                    <a class="nav-link" th:href="@{/payment/my-payments}">
                        <i class="bi bi-wallet2 me-1"></i>My Payments
                    </a>
                </li>

                <!-- VERIFICATION_OFFICER Links Only -->
                <li class="nav-item" sec:authorize="hasAuthority('VERIFICATION_OFFICER') and !hasAuthority('SUPER_ADMIN')">
                    <a class="nav-link" th:href="@{/verification/queue}">
                        <i class="bi bi-clipboard-check me-1"></i>Verification Queue
                    </a>
                </li>

                <!-- SUPER_ADMIN Links Only -->
                <li class="nav-item" sec:authorize="hasAuthority('SUPER_ADMIN')">
                    <a class="nav-link" th:href="@{/admin/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('SUPER_ADMIN')">
                    <a class="nav-link" th:href="@{/admin/users}">
                        <i class="bi bi-people me-1"></i>User Management
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('SUPER_ADMIN')">
                    <a class="nav-link" th:href="@{/verification/queue}">
                        <i class="bi bi-clipboard-check me-1"></i>Verification Queue
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAuthority('SUPER_ADMIN')">
                    <a class="nav-link" th:href="@{/admin/audit-log}">
                        <i class="bi bi-journal-text me-1"></i>Audit Log
                    </a>
                </li>

            </ul>
            <ul class="navbar-nav navbar-actions">
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <button class="btn navbar-account-trigger" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Open account menu" title="Account menu">
                        <i class="bi bi-person-circle"></i>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end navbar-account-menu">
                        <div class="navbar-account-menu__identity">
                            <span class="navbar-account-menu__avatar"><i class="bi bi-person-fill"></i></span>
                            <div>
                                <strong sec:authentication="principal.username">User account</strong>
                                <small sec:authentication="name">user@example.com</small>
                            </div>
                        </div>
                        <div class="navbar-account-menu__divider"></div>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="navbar-account-menu__logout">
                                <i class="bi bi-box-arrow-right"></i><span>Sign out</span>
                            </button>
                        </form>
                    </div>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/login}">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Login
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

</body>
</html>
