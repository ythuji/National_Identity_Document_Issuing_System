<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<header th:fragment="topbar(pageTitle)" class="adm-tb">
    <div class="adm-tb-left">
        <nav class="adm-crumb">
            <a class="adm-crumb-home" th:href="@{/admin/dashboard}" title="Admin Dashboard">
                <i class="bi bi-house-door"></i>
            </a>
            <span class="adm-crumb-sep"><i class="bi bi-chevron-right"></i></span>
            <span class="adm-crumb-cur" th:text="${pageTitle}">Overview</span>
        </nav>
    </div>
    <div class="adm-tb-right">
        <div class="adm-tb-pill"><i class="bi bi-circle-fill"></i> Online</div>
        <div class="adm-tb-user">
            <div class="adm-tb-ava"><i class="bi bi-person-fill"></i></div>
            <span sec:authentication="principal.username">Admin</span>
        </div>
    </div>
</header>

</body>
</html>
