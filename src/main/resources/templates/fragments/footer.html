<html xmlns:th="http://www.thymeleaf.org">
<body>

            <span class="nidis-footer__tagline">Secure digital identity services</span>
            <nav class="nidis-footer__links" aria-label="Footer links">
                <a th:href="@{/license}">License</a>
                <a th:href="@{/passport}">Passport</a>
                <a th:href="@{/nic}">NIC</a>

<!-- Bootstrap 5 JS Bundle and shared form validation -->
<th:block th:fragment="scripts">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Universal client-side form validation (Bootstrap needs-validation)
    document.querySelectorAll('.needs-validation').forEach(function (form) {
        form.addEventListener('submit', function (event) {
            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
                
                const firstInvalid = form.querySelector(':invalid');
                if (firstInvalid) {
                    firstInvalid.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    firstInvalid.focus();
                }
            }
            form.classList.add('was-validated');
        }, false);

        // Real-time clearing of is-invalid when user corrects input
        form.querySelectorAll('.form-control, .form-select').forEach(function (input) {
            input.addEventListener('input', function () {
                if (input.classList.contains('is-invalid') && input.checkValidity()) {
                    input.classList.remove('is-invalid');
                }
            });
            input.addEventListener('change', function () {
                if (input.classList.contains('is-invalid') && input.checkValidity()) {
                    input.classList.remove('is-invalid');
                }
            });
        });
    });

    document.querySelectorAll('.phone-input').forEach(function (phone) {
        phone.addEventListener('input', function () {
            phone.value = phone.value.replace(/\D/g, '').slice(0, 10);
            if (phone.value.length === 10) {
                phone.setCustomValidity('');
            }
        });
    });

    document.querySelectorAll('.dob-input').forEach(function (dateInput) {
        const today = new Date();
        const todayText = today.toISOString().slice(0, 10);
        dateInput.max = todayText;

        function validateDob() {
            if (!dateInput.value) {
                dateInput.setCustomValidity('');
                return;
            }

            const birthDate = new Date(dateInput.value + 'T00:00:00');
            if (dateInput.value > todayText) {
                dateInput.setCustomValidity('Date of birth cannot be in the future.');
                const feedback = dateInput.parentElement.querySelector('.invalid-feedback');
                if (feedback) feedback.textContent = 'Date of birth cannot be in the future.';
                return;
            }

            if (dateInput.dataset.adultRequired === 'true') {
                let age = today.getFullYear() - birthDate.getFullYear();
                const birthdayNotReached = today.getMonth() < birthDate.getMonth() ||
                    (today.getMonth() === birthDate.getMonth() && today.getDate() < birthDate.getDate());
                if (birthdayNotReached) age--;

                if (age < 18) {
                    const msg = 'Applicant must be over 18 years old (Current age: ' + age + ').';
                    dateInput.setCustomValidity(msg);
                    const feedback = dateInput.parentElement.querySelector('.invalid-feedback');
                    if (feedback) feedback.textContent = msg;
                } else {
                    dateInput.setCustomValidity('');
                }
            } else {
                dateInput.setCustomValidity('');
            }
        }

        dateInput.addEventListener('change', validateDob);
        dateInput.addEventListener('input', validateDob);
    });
</script>
</th:block>

</body>
</html>
