<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<nav th:fragment="sidebar(activeTab)" class="adm-sb">

    <!-- ── Brand ─────────────────────────────────────────── -->
    <div class="adm-sb-brand">
      <div class="adm-sb-icon"><i class="bi bi-shield-shaded"></i></div>
      <div>
        <div class="adm-sb-title">NIDIS</div>
        <div class="adm-sb-sub">CONTROL PANEL</div>
      </div>
    </div>

    <!-- ── Navigation ─────────────────────────────────────── -->
    <div class="adm-sb-nav">
      <div class="adm-sb-grp">Core</div>
      <a class="adm-sb-link" th:classappend="${activeTab == 'dashboard' ? 'active' : ''}" th:href="@{/admin/dashboard}">
        <span class="adm-sb-lico"><i class="bi bi-speedometer2"></i></span>Dashboard
      </a>
      <a class="adm-sb-link" th:classappend="${activeTab == 'queue' ? 'active' : ''}" th:href="@{/verification/queue}">
        <span class="adm-sb-lico"><i class="bi bi-clipboard-check"></i></span>Verification Queue
      </a>

      <div class="adm-sb-grp">Management</div>
      <a class="adm-sb-link" th:classappend="${activeTab == 'users' ? 'active' : ''}" th:href="@{/admin/users}">
        <span class="adm-sb-lico"><i class="bi bi-people"></i></span>User Management
      </a>
      <a class="adm-sb-link" th:classappend="${activeTab == 'audit' ? 'active' : ''}" th:href="@{/admin/audit-log}">
        <span class="adm-sb-lico"><i class="bi bi-journal-text"></i></span>Audit Trail
      </a>
    </div>

    <!-- ── Sidebar Footer ─────────────────────────────────── -->
    <div class="adm-sb-foot">
      <div class="adm-sb-sys">
        <span class="adm-sb-dot"></span>All systems operational
      </div>
      <div class="adm-sb-user">
        <div class="adm-sb-av"><i class="bi bi-person-fill"></i></div>
        <div style="min-width:0;flex:1">
          <div class="adm-sb-uname" sec:authentication="principal.username">Administrator</div>
          <div class="adm-sb-urole">Super Admin</div>
        </div>
        <form th:action="@{/logout}" method="post">
          <button type="submit" class="adm-sb-logout" title="Sign out">
            <i class="bi bi-box-arrow-right"></i>
          </button>
        </form>
      </div>
      <div class="adm-sb-ver">NIDIS · 2026</div>
    </div>

</nav>

</body>
</html>
