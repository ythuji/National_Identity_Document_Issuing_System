<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="sidebar(activeTab)" class="admin-sidebar p-3 h-100">
    <!-- Sidebar Header -->
    <div class="d-flex align-items-center pb-3 mb-2 border-bottom">
        <div class="rounded bg-primary bg-opacity-10 p-2 text-primary me-2">
            <i class="bi bi-shield-shaded fs-5"></i>
        </div>
        <div>
            <div class="fw-bold text-dark small" style="letter-spacing: 0.3px;">ADMIN CONSOLE</div>
            <span class="badge badge-subtle-danger" style="font-size: 0.65rem;">SUPER ADMIN</span>
        </div>
    </div>

    <!-- Navigation Section: Core Portal -->
    <div class="sidebar-heading">Core Portal</div>
    <ul class="nav flex-column mb-2">
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/dashboard}"
               th:classappend="${activeTab == 'dashboard' ? 'active' : ''}">
                <i class="bi bi-speedometer2"></i>
                <span>Admin Dashboard</span>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/verification/queue}"
               th:classappend="${activeTab == 'queue' ? 'active' : ''}">
                <i class="bi bi-clipboard-check"></i>
                <span>Verification Queue</span>
            </a>
        </li>
    </ul>

    <!-- Navigation Section: Administration -->
    <div class="sidebar-heading">Management & Security</div>
    <ul class="nav flex-column mb-auto">
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/users}"
               th:classappend="${activeTab == 'users' ? 'active' : ''}">
                <i class="bi bi-people"></i>
                <span>User Management</span>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/admin/audit-log}"
               th:classappend="${activeTab == 'audit' ? 'active' : ''}">
                <i class="bi bi-journal-text"></i>
                <span>Audit Trail Log</span>
            </a>
        </li>
    </ul>

    <!-- Sidebar Footer -->
    <div class="pt-3 mt-auto border-top">
        <div class="d-flex align-items-center justify-content-between text-muted small px-1">
            <span>System Status:</span>
            <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25" style="font-size: 0.7rem;">
                <i class="bi bi-circle-fill me-1" style="font-size: 0.5rem;"></i>Online
            </span>
        </div>
    </div>
</div>

</body>
</html>
