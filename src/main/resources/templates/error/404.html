<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Page Not Found')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="text-center p-5 bg-white rounded-4 shadow-sm" style="max-width: 550px;">
        <div class="rounded-circle bg-warning bg-opacity-10 d-inline-flex p-4 text-warning mb-3">
            <i class="bi bi-compass display-3"></i>
        </div>
        <h2 class="fw-bold text-dark mb-2">404 — Page Not Found</h2>
        <p class="text-muted mb-4">
            The service page or resource you are searching for does not exist or has been relocated.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a th:href="@{/dashboard}" class="btn btn-primary px-4">
                <i class="bi bi-speedometer2 me-1"></i>Back to Dashboard
            </a>
            <a th:href="@{/}" class="btn btn-outline-secondary px-4">
                <i class="bi bi-house me-1"></i>Home
            </a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/footer :: scripts}"></th:block>
</body>
</html>
