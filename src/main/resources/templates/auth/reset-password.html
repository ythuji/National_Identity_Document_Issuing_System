<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Set New Password')}"></head>
<body class="portal-page d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card auth-card">
                <div class="card-header">
                    <h4 class="mb-0 fw-bold"><i class="bi bi-shield-lock me-2"></i>New Password</h4>
                    <p class="small mb-0 opacity-75">Enter your reset code and set your new password</p>
                </div>
                <div class="card-body p-4">

                    <!-- Info Alert -->
                    <div th:if="${infoMessage}" class="alert alert-info py-2 small" role="alert">
                        <i class="bi bi-info-circle me-1"></i>
                        <span th:text="${infoMessage}"></span>
                    </div>

                    <!-- Error Alert -->
                    <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i>
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <form th:action="@{/reset-password}" th:object="${resetPasswordDto}" method="post">
                        <input type="hidden" th:field="*{email}">

                        <div class="mb-3">
                            <label for="otpCode" class="form-label">6-Digit Verification Code</label>
                            <input type="text" class="form-control text-center fw-bold fs-5 tracking-wider"
                                   id="otpCode" th:field="*{otpCode}" maxlength="6"
                                   th:classappend="${#fields.hasErrors('otpCode')} ? 'is-invalid' : ''"
                                   placeholder="123456" required autofocus>
                            <div class="invalid-feedback" th:errors="*{otpCode}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="newPassword" class="form-label">New Password</label>
                            <input type="password" class="form-control" id="newPassword" th:field="*{newPassword}"
                                   th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid' : ''"
                                   placeholder="Min 8 characters" required>
                            <div class="invalid-feedback" th:errors="*{newPassword}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirm New Password</label>
                            <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}"
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                                   placeholder="Re-type new password" required>
                            <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary py-2 fw-semibold">
                                <i class="bi bi-check2-circle me-2"></i>Reset & Save Password
                            </button>
                        </div>
                    </form>

                    <hr class="my-4">

                    <div class="text-center">
                        <a th:href="@{/login}" class="small text-secondary text-decoration-none">
                            <i class="bi bi-arrow-left me-1"></i>Cancel and Return to Sign In
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/footer :: scripts}"></th:block>
</body>
</html>
