<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Forgot Password')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card auth-card">
                <div class="card-header">
                    <h4 class="mb-0 fw-bold"><i class="bi bi-question-circle-fill me-2"></i>Reset Password</h4>
                    <p class="small mb-0 opacity-75">Recover access to your NIDIS account</p>
                </div>
                <div class="card-body p-4">

                    <!-- Error Alert -->
                    <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i>
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <p class="text-muted small">
                        Enter your registered email address and we'll dispatch a verification code to reset your password.
                    </p>

                    <form th:action="@{/forgot-password}" method="post">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email"
                                       placeholder="name@example.com" required autofocus>
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary py-2 fw-semibold">
                                <i class="bi bi-send me-2"></i>Send Verification Code
                            </button>
                        </div>
                    </form>

                    <hr class="my-4">

                    <div class="text-center">
                        <a th:href="@{/login}" class="small text-secondary text-decoration-none">
                            <i class="bi bi-arrow-left me-1"></i>Return to Sign In
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/footer :: scripts}"></th:block>
</body>
</html>
