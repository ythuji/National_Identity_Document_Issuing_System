<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Verify Email')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card auth-card">
                <div class="card-header">
                    <h4 class="mb-0 fw-bold"><i class="bi bi-shield-check me-2"></i>Verify Email</h4>
                    <p class="small mb-0 opacity-75">Enter the one-time code sent to your inbox</p>
                </div>
                <div class="card-body p-4 text-center">

                    <div class="mb-3">
                        <i class="bi bi-envelope-check text-primary" style="font-size: 3rem;"></i>
                    </div>

                    <p class="text-muted small">
                        We sent a 6-digit confirmation code to:
                        <br><strong th:text="${email}" class="text-dark">user@example.com</strong>
                    </p>

                    <!-- Info Alert -->
                    <div th:if="${infoMessage}" class="alert alert-info py-2 small" role="alert">
                        <i class="bi bi-info-circle me-1"></i>
                        <span th:text="${infoMessage}"></span>
                    </div>

                    <!-- Error Alert -->
                    <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i>
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <form th:action="@{/verify-otp}" method="post">
                        <input type="hidden" name="email" th:value="${email}">

                        <div class="mb-3 text-start">
                            <label for="otpCode" class="form-label text-center d-block">6-Digit Verification Code</label>
                            <input type="text" class="form-control text-center fw-bold fs-4 tracking-wider"
                                   id="otpCode" name="otpCode" maxlength="6" pattern="[0-9]{6}"
                                   placeholder="123456" required autofocus autocomplete="one-time-code">
                            <div class="form-text text-center">Valid for 15 minutes</div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary py-2 fw-semibold">
                                <i class="bi bi-check-circle me-2"></i>Verify & Complete Registration
                            </button>
                        </div>
                    </form>

                    <form th:action="@{/resend-otp}" method="post" class="mt-3">
                        <input type="hidden" name="email" th:value="${email}">
                        <button type="submit" class="btn btn-link text-decoration-none small text-muted">
                            <i class="bi bi-arrow-clockwise me-1"></i>Didn't receive code? Resend
                        </button>
                    </form>

                    <hr class="my-3">

                    <div class="text-center">
                        <a th:href="@{/register}" class="small text-secondary text-decoration-none">
                            <i class="bi bi-arrow-left me-1"></i>Back to Registration
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/footer :: scripts}"></th:block>
</body>
</html>
