spring.application.name=National_Identity_Document_Issuing_System

# ========================
# Microsoft SQL Server Configuration
# ========================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=NIDIS_DB;encrypt=true;trustServerCertificate=true
spring.datasource.username=nidis_admin
spring.datasource.password=Nidis@2026Secure
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ========================
# JPA / Hibernate Configuration
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ========================
# Spring Session (JDBC)
# ========================
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

# ========================
# Spring Security
# ========================
# Defer datasource initialization so data.sql runs after Hibernate creates tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.separator=GO

# ========================
# Email Configuration (Gmail SMTP)
# ========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ithuji4@gmail.com
spring.mail.password=omcxxqqilzpzbwxt
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ========================
# File Upload Limits
# ========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ========================
# Thymeleaf Configuration
# ========================
spring.thymeleaf.cache=false

# ========================
# Server Configuration
# ========================
server.port=8080
